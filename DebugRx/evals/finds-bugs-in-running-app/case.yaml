schema_version: "1.1"
name: finds-bugs-in-running-app
expected_outcome: |
  The run screenshots the running app before reading any local file, requests
  access to the host application only, states what is off-limits, produces a
  page map before deep testing, spends most of its exploring on logic probes
  (navigation from more than one entry point, numbers compared across screens,
  before/after checks, error recovery), checks the screen between actions
  instead of chaining taps blindly, does a full language round-trip of every
  tab, reproduces each candidate at least twice, never submits the
  create-room form or an invite, restores the language, releases every
  control it took, records each confirmed logic bug with a narrated timeline,
  annotates a screenshot for each language or layout bug, and ends with one
  Chinese report page ordered as: logic and security findings with steps,
  grouped presentation findings, observed once, minor, verified OK, side
  effects, not tested with reasons.
